<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MCP Shelf{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #242736;
            --border: #2e3144;
            --text: #e4e4e7;
            --text-dim: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 56px;
            gap: 2rem;
        }
        nav .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            text-decoration: none;
        }
        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
        }
        nav a:hover, nav a.active {
            color: var(--text);
            border-bottom-color: var(--primary);
        }
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); }
        .btn-sm { padding: 0.25rem 0.75rem; font-size: 0.8rem; }
        .btn-danger { background: var(--error); color: white; }
        .btn-danger:hover { opacity: 0.9; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .card h3 { margin-bottom: 0.5rem; }
        .grid { display: grid; gap: 1rem; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-mcp { background: #3b82f620; color: #60a5fa; }
        .badge-tool { background: #22c55e20; color: #4ade80; }
        .badge-skill { background: #a855f720; color: #c084fc; }
        .badge-active { background: #22c55e20; color: #4ade80; }
        .badge-inactive { background: #ef444420; color: #f87171; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; }
        input, textarea, select {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.5rem 0.75rem;
            color: var(--text);
            font-size: 0.875rem;
            width: 100%;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        label { display: block; margin-bottom: 0.25rem; font-size: 0.85rem; color: var(--text-dim); }
        .form-group { margin-bottom: 1rem; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; align-items: center; }
        .flex-gap { gap: 0.5rem; }
        .text-dim { color: var(--text-dim); }
        .text-sm { font-size: 0.85rem; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            nav { gap: 1rem; padding: 0 1rem; }
            main { padding: 0 1rem; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/" class="brand">MCP Shelf</a>
        <a href="/capabilities" {% if request.url.path.startswith('/capabilities') %}class="active"{% endif %}>Capabilities</a>
        <a href="/bindings" {% if request.url.path.startswith('/bindings') %}class="active"{% endif %}>Bindings</a>
        <a href="/playground" {% if request.url.path.startswith('/playground') %}class="active"{% endif %}>Playground</a>
        <a href="/settings" {% if request.url.path.startswith('/settings') %}class="active"{% endif %}>Settings</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
